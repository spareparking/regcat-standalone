[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regcat"
version = "0.1.0"
description = "Multi-agent document decomposition with provable verbatim coverage (packaged standalone from the Anvil repo, 2026-08-19)"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",     # PDF text extraction (stages/ingest.py)
  "pydantic>=2.7",     # all stage schemas
  "click>=8.1",        # CLI
]

[project.optional-dependencies]
# LLM backends are optional: mock mode (fixture replay) needs none of them.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.68.0"]
claude-code = ["claude-agent-sdk>=0.1"]   # requires `claude login` (subscription auth)
dev = ["pytest>=8"]

[project.scripts]
regcat = "regcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
